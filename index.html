<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المواقع الأثرية</title>

<style>
body{
margin:0;
font-family:"Tahoma";
direction:rtl;
overflow:hidden;
}

/* الصفحات */
.page{
position:fixed;
top:0;
right:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:0.6s;
}

/* الغلاف */
#cover{
background:linear-gradient(to bottom,#004d40,#009688);
color:white;
z-index:2;
text-align:center;
}

/* الصفحة الثانية */
#main{
background:#eef2f3;
opacity:0;
pointer-events:none;
padding:20px;
overflow:auto;
align-items:stretch;
}

/* تفعيل الصفحة */
#main.active{
opacity:1;
pointer-events:auto;
}

/* إخفاء الغلاف */
#cover.hide{
transform:translateX(-100%);
}

/* الخريطة */
.map-img{
width:180px;
opacity:0.85;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

/* التخطيط */
.main-container{
display:flex;
gap:20px;
align-items:flex-start;
}

/* الأزرار */
.governorates{
flex:1;
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
background:#009688;
color:white;
}

button:hover{
background:#004d40;
transform:scale(1.05);
}

/* المعلومات */
.info-box{
margin-top:20px;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
max-width:800px;
margin-left:auto;
margin-right:auto;
text-align:right;
}

.site{
padding:8px;
border-bottom:1px solid #ddd;
}

.count{
color:#009688;
font-weight:bold;
margin-bottom:10px;
}
</style>
</head>

<body>

<!-- الغلاف -->
<div class="page" id="cover">
<h1>المواقع الأثرية في سلطنة عمان</h1>
<p>الصف: الحادي عشر / سابع</p>
<p>مدرسة الشيخة نضيرة الريامية</p>
<p>المعلمة: أ. زمزم السليمانية</p>

<button onclick="enterSite()">دخول المشروع</button>
</div>

<!-- الصفحة الثانية -->
<div class="page" id="main">

<h2 style="text-align:center;">اختر محافظة</h2>

<div class="main-container">

<img src="oman-map.jpg" class="map-img">

<div class="governorates" id="buttons"></div>

</div>

<div class="info-box" id="infoBox">
اختر محافظة لعرض المعلومات
</div>

</div>

<script>

/* الانتقال (يشبه صفحة جديدة) */
function enterSite(){
document.getElementById("cover").classList.add("hide");
document.getElementById("main").classList.add("active");
}

/* البيانات */
const data = {

muscat:{name:"مسقط",sites:[
"تضم سلسلة جبال حجر عمان",
"تضم سهل الباطنة",
"محمية النباتات والأشجار العمانية",
"رأس الحمراء والوطية",
"جزر الديمانيات"
]},

buraymi:{name:"البريمي",sites:[
"أرض الجو",
"موقع قميرا وحفيت"
]},

dakhiliyah:{name:"الداخلية",sites:[
"مسفاة العبريين",
"كهف الهوتة",
"جبل شمس",
"واحة نزوى",
"فلج الملكي",
"موقع سلوت"
]},

dhahirah:{name:"الظاهرة",sites:[
"أرض السر",
"آثار وادي العين",
"موقع بات"
]},

north_batinah:{name:"شمال الباطنة",sites:[
"والي العباسيين على صحار",
"خور وادي الجزي"
]},

south_batinah:{name:"جنوب الباطنة",sites:[
"سبخات السوادي",
"خور السوادي",
"جزر السوادي"
]},

musandam:{name:"مسندم",sites:[
"خور شم",
"جزيرة التلغراف"
]},

north_sharqiyah:{name:"شمال الشرقية",sites:[
"رمال الشرقية (ال وهيبة)"
]},

south_sharqiyah:{name:"جنوب الشرقية",sites:[
"قلهات",
"جزيرة مصيرة"
]},

wusta:{name:"الوسطى",sites:[
"صحراء الحقف",
"حديقة الصخور الدقم"
]},

dhofar:{name:"ظفار",sites:[
"عين ارزات",
"خور المغسيل",
"شجرة اللبان",
"كهف المرنيف"
]}

};

/* إنشاء الأزرار */
const buttonsDiv=document.getElementById("buttons");

for(let key in data){
let btn=document.createElement("button");
btn.innerText=data[key].name;
btn.onclick=()=>showInfo(key);
buttonsDiv.appendChild(btn);
}

/* عرض المعلومات */
function showInfo(region){
const info=data[region];

let content=`<h2>${info.name}</h2>`;
content+=`<div class="count">عدد المواقع: ${info.sites.length}</div>`;

info.sites.forEach((site,index)=>{
content+=`<div class="site">${index+1}- ${site}</div>`;
});

document.getElementById("infoBox").innerHTML=content;
}

</script>

</body>
</html>
