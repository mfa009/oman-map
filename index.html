<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المواقع الأثرية في سلطنة عمان</title>

<style>
body{
margin:0;
font-family:"Tahoma", sans-serif;
direction:rtl;
background:#f5f5f5;
}

.cover{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#004d40,#00796b);
color:white;
text-align:center;
padding:20px;
}

.cover h1{
font-size:28px;
margin-bottom:20px;
}

.cover button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
background:white;
color:#004d40;
margin-top:20px;
}

.content{
display:none;
padding:30px;
text-align:center;
}

h2{
color:#004d40;
}

.governorates{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
margin-top:20px;
}

.gov-btn{
background:#00796b;
color:white;
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

.gov-btn:hover{
background:#004d40;
transform:scale(1.05);
}

.info-box{
margin-top:30px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.15);
max-width:800px;
margin:auto;
text-align:right;
animation:fadeIn 0.5s ease;
}

ul{
line-height:1.9;
font-size:16px;
}

/* حركة ظهور */
@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

/* الصور */
.info-box img{
cursor:pointer;
transition:0.3s;
}

.info-box img:hover{
transform:scale(1.08);
}

/* نافذة الصورة */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:999;
}

.modal img{
max-width:80%;
border-radius:10px;
}

.modal span{
position:absolute;
top:20px;
right:30px;
font-size:30px;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="cover" id="cover">
<h1>المواقع الأثرية في محافظات سلطنة عمان</h1>
<p>الصف: الحادي عشر / سابع</p>
<p>مدرسة الشيخة نضيرة الريامية</p>
<p>المعلمة: أ. زمزم السليمانية</p>
<button onclick="startProject()">دخول المشروع</button>
</div>

<div class="content" id="content">

<h2>اختر محافظة لعرض مواقعها الأثرية</h2>

<div style="display:flex; align-items:flex-start; gap:20px;">

<img src="oman-map.jpg" style="width:150px; border-radius:10px;">

<div style="flex:1;">

<div class="governorates">

<button class="gov-btn" onclick="showInfo('muscat')">مسقط</button>
<button class="gov-btn" onclick="showInfo('musandam')">مسندم</button>
<button class="gov-btn" onclick="showInfo('north_batinah')">شمال الباطنة</button>
<button class="gov-btn" onclick="showInfo('south_batinah')">جنوب الباطنة</button>
<button class="gov-btn" onclick="showInfo('dakhiliyah')">الداخلية</button>
<button class="gov-btn" onclick="showInfo('north_sharqiyah')">شمال الشرقية</button>
<button class="gov-btn" onclick="showInfo('south_sharqiyah')">جنوب الشرقية</button>
<button class="gov-btn" onclick="showInfo('dhahirah')">الظاهرة</button>
<button class="gov-btn" onclick="showInfo('wusta')">الوسطى</button>
<button class="gov-btn" onclick="showInfo('dhofar')">ظفار</button>
<button class="gov-btn" onclick="showInfo('buraymi')">البريمي</button>

</div>

<div class="info-box" id="infoBox">
اختر محافظة لعرض المعلومات.
</div>

</div>
</div>

</div>

<!-- نافذة تكبير الصورة -->
<div class="modal" id="imgModal">
<span onclick="closeModal()">×</span>
<img id="modalImg">
</div>

<script>

function startProject(){
document.getElementById("cover").style.display="none";
document.getElementById("content").style.display="block";
}

const data = {

muscat:{
name:"محافظة مسقط",
images:["images (1).jpg","3.jpeg"],
sites:[
"تضم سلسلة جبال حجر عمان",
"تضم سهل الباطنة",
"محمية حديقة النباتات و الأشجار العمانية",
"رأس الحمراء و الوطية",
"جزر الديمانيات"
]
},

buraymi:{
name:"محافظة البريمي",
images:["4.jpg","11.jpg"],
sites:[
"أرض الجو",
"موقع قميرا و حفيت"
]
},

dakhiliyah:{
name:"محافظة الداخلية",
images:["7.jpg","8.jpg"],
sites:[
"مسفاة العبريين في الحمراء",
"أرض الجوف",
"كهف الهوتة",
"جبل شمس",
"واحة نزوى",
"فلج الملكي",
"موقع سلوت"
]
},

dhahirah:{
name:"محافظة الظاهرة",
sites:[
"أرض السر",
"آثار وادي العين",
"موقع بات في عبري"
]
},

north_batinah:{
name:"محافظة شمال الباطنة",
images:["5.jpg"],
sites:[
"والي العباسيين على صحار",
"خور وادي الجزي",
"تضم سلسلة جبال حجر عمان و سهل الباطنة"
]
},

south_batinah:{
name:"محافظة جنوب الباطنة",
images:["6.jpg"],
sites:[
"تضم سلسلة جبال حجر عمان و سهل الباطنة",
"سبخات السوادي",
"خور السوادي",
"جزر السوادي"
]
},

musandam:{
name:"محافظة مسندم",
sites:[
"تضم سلسلة جبال حجر عمان",
"خور شم",
"أرض الصير",
"جزيرة الغنم ، الخيل ، سلامة و بناتها",
"جزيرة التلغراف"
]
},

north_sharqiyah:{
name:"محافظة شمال الشرقية",
sites:[
"رمال الشرقية و ال وهيبة"
]
},

south_sharqiyah:{
name:"محافظة جنوب الشرقية",
images:["9.jpg","10.jpg"],
sites:[
"موقع قلهات",
"محمية حديقة السليل الطبيعية",
"جزيرة مصيرة",
"خور جراما",
"رمال الشرقية و ال وهيبة"
]
},

wusta:{
name:"محافظة الوسطى",
sites:[
"صحراء الحقف",
"سبخة ام السميم",
"واحة جدة الحراسيس في هيما",
"حديقة الصخور الدقم"
]
},

dhofar:{
name:"محافظة ظفار",
images:["12.jpg","13.jpg"],
sites:[
"عين ارزات",
"عين حمران",
"محمية جبل سمحان",
"خور المغسيل",
"شجرة اللبان",
"كهف المرنيف",
"إعصار مكونو",
"جزر الحلانيات",
"ارض بلاد الشحر"
]
}

};

function showInfo(region){

const info = data[region];

if(!info){
document.getElementById("infoBox").innerHTML="لا توجد بيانات";
return;
}

let content = `<h2>${info.name}</h2>`;

if(info.images){
content += `<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px;">`;

info.images.forEach(img=>{
content += `<img src="${img}" onclick="openModal(this.src)" style="width:120px; border-radius:8px;">`;
});

content += `</div>`;
}

content += "<ul>";

info.sites.forEach(site=>{
content += `<li>${site}</li>`;
});

content += "</ul>";

document.getElementById("infoBox").innerHTML = content;

}

/* تكبير الصور */
function openModal(src){
document.getElementById("imgModal").style.display="flex";
document.getElementById("modalImg").src=src;
}

function closeModal(){
document.getElementById("imgModal").style.display="none";
}

</script>

</body>
</html>
