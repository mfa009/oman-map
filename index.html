<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المواقع الأثرية في سلطنة عمان</title>

<style>
body{
margin:0;
font-family:"Tahoma", sans-serif;
direction:rtl;
background:#f5f5f5;
}

/* صفحة الغلاف */
.cover{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#004d40,#00796b);
color:white;
text-align:center;
padding:20px;
}

.cover h1{
font-size:28px;
margin-bottom:20px;
}

.cover button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
background:white;
color:#004d40;
margin-top:20px;
}

/* صفحة المحتوى */
.content{
display:none;
padding:30px;
text-align:center;
}

h2{
color:#004d40;
}

/* أزرار المحافظات */
.governorates{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
margin-top:20px;
}

.gov-btn{
background:#00796b;
color:white;
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

.gov-btn:hover{
background:#004d40;
}

/* صندوق المعلومات */
.info-box{
margin-top:30px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.15);
max-width:800px;
margin-left:auto;
margin-right:auto;
text-align:right;
}

ul{
line-height:1.9;
font-size:16px;
}
</style>
</head>

<body>

<!-- صفحة الغلاف -->
<div class="cover" id="cover">
<h1>المواقع الأثرية في محافظات سلطنة عمان</h1>
<p>الصف: الحادي عشر / سابع</p>
<p>مدرسة الشيخة نضيرة الريامية</p>
<p>المعلمة: أ. زمزم السليمانية</p>
<button onclick="startProject()">دخول المشروع</button>
</div>

<!-- صفحة القائمة -->
<div class="content" id="content">

<h2>اختر محافظة لعرض مواقعها الأثرية</h2>

<!-- إضافة الخريطة -->
<div style="display:flex; align-items:flex-start; gap:20px;">

<img src="oman-map.jpg" style="
width:150px;
border-radius:10px;
opacity:0.85;
box-shadow:0 3px 8px rgba(0,0,0,0.2);
">

<div style="flex:1;">

<div class="governorates">

<button class="gov-btn" onclick="showInfo('muscat')">مسقط</button>
<button class="gov-btn" onclick="showInfo('musandam')">مسندم</button>
<button class="gov-btn" onclick="showInfo('north_batinah')">شمال الباطنة</button>
<button class="gov-btn" onclick="showInfo('south_batinah')">جنوب الباطنة</button>
<button class="gov-btn" onclick="showInfo('dakhiliyah')">الداخلية</button>
<button class="gov-btn" onclick="showInfo('north_sharqiyah')">شمال الشرقية</button>
<button class="gov-btn" onclick="showInfo('south_sharqiyah')">جنوب الشرقية</button>
<button class="gov-btn" onclick="showInfo('dhahirah')">الظاهرة</button>
<button class="gov-btn" onclick="showInfo('wusta')">الوسطى</button>
<button class="gov-btn" onclick="showInfo('dhofar')">ظفار</button>
<button class="gov-btn" onclick="showInfo('buraymi')">البريمي</button>

</div>

<div class="info-box" id="infoBox">
اختر محافظة لعرض المعلومات.
</div>

</div>
</div>

</div>

<script>

function startProject(){
document.getElementById("cover").style.display="none";
document.getElementById("content").style.display="block";
}

const data = {

muscat:{
name:"محافظة مسقط",
sites:[
"تضم سلسلة جبال حجر عمان",
"تضم سهل الباطنة",
"محمية حديقة النباتات والأشجار العمانية",
"رأس الحمراء والوطية",
"جزر الديمانيات (بين السيب وبركاء)"
]
},

buraymi:{
name:"محافظة البريمي",
sites:[
"أرض الجو",
"موقع قميرا وحفيت"
]
},

dakhiliyah:{
name:"محافظة الداخلية",
sites:[
"مسفاة العبريين في الحمراء",
"أرض الجوف",
"كهف الهوتة",
"جبل شمس",
"واحة نزوى",
"فلج الملكي",
"موقع سلوت"
]
},

dhahirah:{
name:"محافظة الظاهرة",
sites:[
"أرض السر",
"آثار وادي العين",
"موقع بات في عبري"
]
},

north_batinah:{
name:"محافظة شمال الباطنة",
sites:[
"والي العباسيين على صحار",
"خور وادي الجزي",
"تضم سلسلة جبال حجر عمان وسهل الباطنة"
]
},

south_batinah:{
name:"محافظة جنوب الباطنة",
sites:[
"تضم سلسلة جبال حجر عمان وسهل الباطنة",
"سبخات السوادي",
"خور السوادي",
"جزر السوادي"
]
},

musandam:{
name:"محافظة مسندم",
sites:[
"تضم سلسلة جبال حجر عمان",
"خور شم",
"أرض الصير",
"جزيرة الغنم والخيل وسلامة وبناتها",
"جزيرة التلغراف"
]
},

north_sharqiyah:{
name:"محافظة شمال الشرقية",
sites:[
"رمال الشرقية (ال وهيبة)"
]
},

south_sharqiyah:{
name:"محافظة جنوب الشرقية",
sites:[
"موقع قلهات",
"محمية حديقة السليل الطبيعية",
"جزيرة مصيرة",
"خور جراما",
"رمال الشرقية (ال وهيبة)"
]
},

wusta:{
name:"محافظة الوسطى",
sites:[
"صحراء الحقف",
"سبخة أم السميم",
"واحة جدة الحراسيس في هيما",
"حديقة الصخور الدقم"
]
},

dhofar:{
name:"محافظة ظفار",
sites:[
"عين ارزات",
"عين حمران",
"محمية جبل سمحان",
"خور المغسيل",
"شجرة اللبان",
"كهف المرنيف",
"إعصار مكونو",
"جزر الحلانيات",
"أرض بلاد الشحر"
]
}

};

function showInfo(region){

const info=data[region];

let content=`<h2>${info.name}</h2><ul>`;

info.sites.forEach(site=>{
content+=`<li>${site}</li>`;
});

content+="</ul>";

document.getElementById("infoBox").innerHTML=content;

}

</script>

</body>
</html>
